<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turbo Kart Arena</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="loading">
    <div class="loading-logo">TURBO KART</div>
    <div class="loading-bar">
        <div id="loadingFill"></div>
    </div>
    <div>Ładowanie gry...</div>
</div>

<div id="menu" class="screen hidden">
    <div class="menu-box">
        <div class="logo">TURBO<br><span>KART</span></div>
        <div class="subtitle">ARENA</div>

        <button id="startButton" class="main-button">START WYŚCIGU</button>
        <button id="garageButton" class="menu-button">GARAŻ</button>
        <button id="controllerButton" class="menu-button">KONTROLERY</button>

        <div class="small-info">
            PC: WASD / STRZAŁKI<br>
            DRIFT: SHIFT<br>
            ITEM: E
        </div>
    </div>
</div>

<div id="garage" class="screen hidden">
    <div class="garage-box">
        <h1>GARAŻ</h1>

        <div class="driver-list">

            <button class="driver active" data-driver="0">
                <div class="driver-icon red">⚡</div>
                <b>VOLT</b>
                <small>Prędkość</small>
            </button>

            <button class="driver" data-driver="1">
                <div class="driver-icon blue">★</div>
                <b>NOVA</b>
                <small>Przyspieszenie</small>
            </button>

            <button class="driver" data-driver="2">
                <div class="driver-icon green">◆</div>
                <b>RUSH</b>
                <small>Skręcanie</small>
            </button>

            <button class="driver" data-driver="3">
                <div class="driver-icon purple">☄</div>
                <b>PIXEL</b>
                <small>Drift</small>
            </button>

        </div>

        <button id="garageBack" class="menu-button">WRÓĆ</button>
    </div>
</div>

<div id="controllerScreen" class="screen hidden">
    <div class="controller-box">
        <h1>KONTROLERY</h1>

        <p>Po uruchomieniu wyścigu na dole ekranu pojawi się kod pokoju.</p>
        <p>Na telefonie otwórz:</p>

        <div class="controller-url">
            <span id="controllerUrl"></span>
        </div>

        <p>Wpisz kod pokazany na ekranie PC.</p>

        <button id="controllerBack" class="menu-button">WRÓĆ</button>
    </div>
</div>

<div id="game" class="hidden">

    <canvas id="gameCanvas"></canvas>

    <div id="hud">

        <div class="hud-top">

            <div class="position">
                <span id="positionNumber">1</span>
                <small>/ 4</small>
            </div>

            <div class="lap">
                OKRĄŻENIE
                <b id="lapNumber">1/3</b>
            </div>

            <div class="speed">
                <b id="speedNumber">0</b>
                <small>KM/H</small>
            </div>

        </div>

        <div class="item-box">
            <span id="itemIcon">?</span>
        </div>

        <div class="nitro-box">
            <div class="nitro-title">TURBO</div>
            <div class="nitro-bar">
                <div id="nitroFill"></div>
            </div>
        </div>

        <div id="roomCode" class="room-code"></div>

    </div>

    <div id="countdown" class="countdown hidden">3</div>

    <div id="finish" class="finish hidden">

        <div class="finish-box">

            <div class="finish-title">META!</div>

            <div id="finishPosition">1</div>

            <div class="finish-text">MIEJSCE</div>

            <button id="restartButton" class="main-button">
                JESZCZE RAZ
            </button>

            <button id="finishMenu" class="menu-button">
                MENU
            </button>

        </div>

    </div>

</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="game.js"></script>

</body>
</html>
