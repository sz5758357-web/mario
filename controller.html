<!DOCTYPE html>
<html lang="pl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no"
    >

    <title>Turbo Racers Controller</title>

    <link
        rel="stylesheet"
        href="controller.css"
    >

</head>

<body>

<div class="controller">

    <header>

        <div class="brand">
            TURBO RACERS
        </div>

        <div id="status">
            NIEPOŁĄCZONO
        </div>

    </header>


    <main>

        <div class="player-number">
            PLAYER 1
        </div>


        <!-- DRIFT -->
        <button
            id="drift"
            class="drift"
        >
            DRIFT
        </button>


        <!-- BOOST -->
        <button
            id="boost"
            class="boost"
        >
            TURBO
        </button>


        <!-- STEERING -->
        <div class="steering">

            <button
                id="left"
                class="direction"
            >
                ◀
            </button>

            <div class="center-wheel">
                STEER
            </div>

            <button
                id="right"
                class="direction"
            >
                ▶
            </button>

        </div>


        <!-- PEDALS -->
        <div class="pedals">

            <button
                id="brake"
                class="pedal brake"
            >
                BRAKE
            </button>

            <button
                id="gas"
                class="pedal gas"
            >
                GAS
            </button>

        </div>


        <!-- ITEM -->
        <button
            id="item"
            class="item"
        >
            🎁
        </button>

    </main>


    <footer>

        <span>
            TURBO RACERS
        </span>

        <span>
            CONTROLLER
        </span>

    </footer>

</div>


<script src="controller.js"></script>

</body>

</html>
